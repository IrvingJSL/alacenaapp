name: alacena_app
description: Inventario doméstico (alacena) con base de datos local SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  table_calendar: ^3.1.2
  badges: ^3.1.2
  image_picker: ^1.1.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
